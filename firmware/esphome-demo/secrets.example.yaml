# Másold le secrets.yaml néven, és töltsd ki. A secrets.yaml NEM kerül a repóba (.gitignore).
#   cp secrets.example.yaml secrets.yaml

# WiFi – csak 2,4 GHz-es hálózat (a C6 5 GHz-et nem lát)
wifi_ssid: "IDE_A_WIFI_NEVE"
