# =====================================================================
#  ModuNode – ESP32-C6 vezérlő demó (szakdolgozat)
#
#  Működés csupasz boardon is (külső alkatrész nélkül):
#    - Webes kezelőfelület:  http://modunode-c6.local  (vagy az IP címe)
#    - Relé 1 kapcsolása a weben vagy a BOOT gombbal (rövid nyomás)
#    - Üzemmód váltás: Kézi <-> Automata (weben, vagy BOOT gomb >1,5 s)
#    - Automata módban az ajtóérzékelő vezérli a relét,
#      csukáskor állítható késleltetéssel kapcsol le
#    - Az RGB LED mutatja az állapotot:
#        zöld = relé BE,  kék = Automata mód, vár,  sötét = Kézi mód, relé KI
#
#  Ajtó szimulálása csupasz boardon: egy jumper kábel a ${door_pin} és GND
#  között = "ajtó csukva" (mágnes a Hall-szenzor előtt). Kihúzva = "nyitva".
# =====================================================================

substitutions:
  name: modunode-c6
  friendly_name: ModuNode C6
  board: esp32-c6-devkitc-1
  rgb_led_pin: GPIO8       # DevKitC-1 és a legtöbb C6 Super Mini: WS2812 a GPIO8-on
  boot_button_pin: GPIO9   # BOOT gomb
  relay_pin: GPIO18        # relé / LED kimenet (nem strapping láb)
  door_pin: GPIO19         # ajtóérzékelő bemenet (Hall-szenzor vagy jumper GND-re)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "ModuNode szakdolgozat – ESP32-C6 vezérlő demó"
  project:
    name: "balazs.modunode-c6"
    version: "0.1.0"
  on_boot:
    priority: -100
    then:
      - script.execute: led_frissites

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Ha nem talál WiFi-t, saját hotspotot nyit (jelszó: secrets.yaml -> ap_password)
  ap:
    ssid: "ModuNode-C6"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  local: true              # internet nélkül is működik (a JS a firmware-ben van)
  sorting_groups:
    - id: grp_vezerles
      name: "Vezérlés"
      sorting_weight: 10
    - id: grp_erzekelok
      name: "Érzékelők"
      sorting_weight: 20
    - id: grp_rendszer
      name: "Rendszer"
      sorting_weight: 30

# ---------------------------------------------------------------------
#  Kimenetek
# ---------------------------------------------------------------------
switch:
  - platform: gpio
    id: rele
    name: "Relé 1"
    icon: mdi:electric-switch
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF   # bootoláskor mindig KI – biztonságos alapállapot
    on_turn_on:
      - script.execute: led_frissites
    on_turn_off:
      - script.execute: led_frissites
    web_server:
      sorting_group_id: grp_vezerles
      sorting_weight: 1

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Állapot LED"
    pin:
      number: ${rgb_led_pin}
      ignore_strapping_warning: true
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 300ms
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Lüktetés"
      - strobe:
          name: "Villogás"
    web_server:
      sorting_group_id: grp_vezerles
      sorting_weight: 4

# ---------------------------------------------------------------------
#  Vezérlési logika paraméterei
# ---------------------------------------------------------------------
select:
  - platform: template
    id: uzemmod
    name: "Üzemmód"
    icon: mdi:robot
    options:
      - "Kézi"
      - "Automata"
    initial_option: "Kézi"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: automata_szinkron
      - script.execute: led_frissites
    web_server:
      sorting_group_id: grp_vezerles
      sorting_weight: 2

number:
  - platform: template
    id: kesleltetes
    name: "Lekapcsolási késleltetés"
    icon: mdi:timer-outline
    unit_of_measurement: s
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: slider
    web_server:
      sorting_group_id: grp_vezerles
      sorting_weight: 3

# ---------------------------------------------------------------------
#  Bemenetek
# ---------------------------------------------------------------------
binary_sensor:
  # Ajtóérzékelő: HIGH (felhúzva) = nyitva, LOW (Hall-szenzor/jumper GND-re) = csukva
  - platform: gpio
    id: ajto
    name: "Ajtó"
    device_class: door
    pin:
      number: ${door_pin}
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 50ms
    on_press:        # kinyílt
      - if:
          condition:
            lambda: 'return id(uzemmod).current_option() == "Automata";'
          then:
            - script.stop: kesleltetett_kikapcs
            - switch.turn_on: rele
    on_release:      # becsukódott
      - if:
          condition:
            lambda: 'return id(uzemmod).current_option() == "Automata";'
          then:
            - script.execute: kesleltetett_kikapcs
    web_server:
      sorting_group_id: grp_erzekelok
      sorting_weight: 1

  # BOOT gomb: rövid nyomás = relé váltás, hosszú (>1,5 s) = üzemmód váltás
  - platform: gpio
    id: boot_gomb
    name: "BOOT gomb"
    icon: mdi:gesture-tap-button
    pin:
      number: ${boot_button_pin}
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - switch.toggle: rele
      - timing:
          - ON for at least 1.5s
        then:
          - select.next:
              id: uzemmod
              cycle: true
    web_server:
      sorting_group_id: grp_erzekelok
      sorting_weight: 2

  - platform: status
    name: "Online"
    web_server:
      sorting_group_id: grp_rendszer

# ---------------------------------------------------------------------
#  Rendszer információk
# ---------------------------------------------------------------------
sensor:
  - platform: internal_temperature
    name: "Chip hőmérséklet"
    update_interval: 30s
    web_server:
      sorting_group_id: grp_erzekelok
      sorting_weight: 3
  - platform: wifi_signal
    name: "WiFi jelerősség"
    update_interval: 30s
    web_server:
      sorting_group_id: grp_rendszer
  - platform: uptime
    name: "Üzemidő"
    web_server:
      sorting_group_id: grp_rendszer

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP cím"
      web_server:
        sorting_group_id: grp_rendszer
  - platform: version
    name: "ESPHome verzió"
    hide_timestamp: true
    web_server:
      sorting_group_id: grp_rendszer

button:
  - platform: restart
    name: "Újraindítás"
    web_server:
      sorting_group_id: grp_rendszer

# ---------------------------------------------------------------------
#  Scriptek
# ---------------------------------------------------------------------
script:
  # Ajtó becsukása után a beállított késleltetéssel kapcsolja le a relét
  - id: kesleltetett_kikapcs
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) (id(kesleltetes).state * 1000.0f);'
      - switch.turn_off: rele

  # Automata módba lépéskor a relé azonnal kövesse az ajtó állapotát
  - id: automata_szinkron
    then:
      - script.stop: kesleltetett_kikapcs
      - if:
          condition:
            lambda: 'return id(uzemmod).current_option() == "Automata";'
          then:
            - if:
                condition:
                  binary_sensor.is_on: ajto
                then:
                  - switch.turn_on: rele
                else:
                  - switch.turn_off: rele

  # RGB LED = állapotjelző
  - id: led_frissites
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: rele
          then:
            - light.turn_on:
                id: status_led
                red: 0%
                green: 100%
                blue: 0%
                brightness: 40%
                effect: "None"
          else:
            - if:
                condition:
                  lambda: 'return id(uzemmod).current_option() == "Automata";'
                then:
                  - light.turn_on:
                      id: status_led
                      red: 0%
                      green: 20%
                      blue: 100%
                      brightness: 25%
                      effect: "None"
                else:
                  - light.turn_off: status_led
